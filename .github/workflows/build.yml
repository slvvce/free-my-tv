name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK (platform 34, build-tools 34)
        run: |
          export ANDROID_HOME="$HOME/sdk"
          mkdir -p "$ANDROID_HOME"
          SDKM="$(ls "${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | head -1)"
          yes | "$SDKM" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$SDKM" --sdk_root="$ANDROID_HOME" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Write config
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
        run: |
          {
            echo "tmdb_key=$TMDB_KEY"
            echo "tmdb_region=BR"
            echo "currency=BRL"
          } > config.properties

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
